# Temporary transport gate for the pnpm Docker smoke test.
# It is triggered manually only, and is deleted once the run-docker command
# owns this coverage.
name: pnpm Docker gate

on:
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=8192 --no-node-snapshot --experimental-vm-modules

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: use node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0

      - name: yarn install
        uses: backstage/actions/yarn-install@a9e1b58ad52aaf319264e18c3ff6887a4c824b52 # v0.7.13
        with:
          cache-prefix: ${{ runner.os }}-v24.x

      - run: yarn tsc

      - run: yarn backstage-cli repo build

      - name: run the transport gate
        # Invoke the CLI directly: the root "test" script sets NODE_OPTIONS and
        # would drop the job's heap size.
        run: E2E_PACK=1 E2E_DOCKER=1 CI=1 NODE_OPTIONS='--max-old-space-size=8192 --no-node-snapshot --experimental-vm-modules' yarn backstage-cli repo test packages/e2e-test/src/lib/dockerTransport.integration.test.ts
        env:
          E2E_DIAGNOSTICS_DIR: ${{ runner.temp }}/e2e-diagnostics

      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-docker-gate-diagnostics
          path: ${{ runner.temp }}/e2e-diagnostics
          if-no-files-found: warn
